# Example configurations for GCP short-lived credentials
# See docs/GCP_SHORT_LIVED_CREDENTIALS.md for detailed setup instructions

# Example 1: Developer workflow (uses gcloud auth login)
# Perfect for local development - no key files needed!
# Prerequisites:
#   1. Run: gcloud auth application-default login
#   2. Grant impersonation permission to your user account
- provider: gcp
  id: dev-discovery
  use_short_lived_credentials: true
  service_account_email: "cloudlist@your-project.iam.gserviceaccount.com"
  # token_lifetime: "3600s"  # Optional: default is 1 hour

# Example 2: CI/CD with minimal permissions
# Uses a minimal-permission service account that can only impersonate
- provider: gcp
  id: ci-discovery
  use_short_lived_credentials: true
  service_account_email: "powerful-sa@your-project.iam.gserviceaccount.com"
  source_credentials: "/path/to/minimal-ci-sa.json"
  token_lifetime: "3600s"  # 1 hour (max)

# Example 3: GKE/Compute Engine workload identity
# Uses workload identity - no credentials in config!
- provider: gcp
  id: workload-discovery
  use_short_lived_credentials: true
  service_account_email: "cloudlist@your-project.iam.gserviceaccount.com"
  token_lifetime: "3600s"

# Example 4: Organization-level discovery with short-lived credentials
- provider: gcp
  id: org-discovery-secure
  organization_id: "123456789012"
  use_short_lived_credentials: true
  service_account_email: "asset-viewer-sa@your-project.iam.gserviceaccount.com"
  token_lifetime: "3600s"

# Example 5: Migration from existing keys
# Generate short-lived tokens from existing service account keys
- provider: gcp
  id: migrating-discovery
  use_short_lived_credentials: true
  service_account_email: "cloudlist@your-project.iam.gserviceaccount.com"
  gcp_service_account_key: |
    {
      "type": "service_account",
      "project_id": "your-project-id",
      "private_key_id": "...",
      "private_key": "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n",
      "client_email": "cloudlist@your-project.iam.gserviceaccount.com",
      "client_id": "...",
      "auth_uri": "https://accounts.google.com/o/oauth2/auth",
      "token_uri": "https://oauth2.googleapis.com/token",
      "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
      "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/cloudlist%40your-project.iam.gserviceaccount.com",
      "universe_domain": "googleapis.com"
    }
  token_lifetime: "3600s"

# Example 6: Traditional authentication (for comparison)
# This is the old approach - still fully supported for backward compatibility
- provider: gcp
  id: traditional-discovery
  gcp_service_account_key: |
    {
      "type": "service_account",
      "project_id": "your-project-id",
      ...
    }

# Configuration parameters:
#
# use_short_lived_credentials (boolean, optional, default: false)
#   - Set to true to enable short-lived token generation
#
# service_account_email (string, required if use_short_lived_credentials is true)
#   - The service account to impersonate
#   - Format: name@project.iam.gserviceaccount.com
#
# source_credentials (string, optional)
#   - Path to source credentials file for impersonation
#   - If not provided, uses Application Default Credentials (ADC)
#   - Can be combined with gcp_service_account_key
#
# token_lifetime (string, optional, default: "3600s")
#   - Token lifetime in seconds (e.g., "3600s") or Go duration format (e.g., "1h")
#   - Valid range: 1s to 3600s (1 hour)
#   - Examples: "3600s", "1h", "30m", "1800s"
#
# gcp_service_account_key (string, optional)
#   - Service account key JSON
#   - Works with both traditional and short-lived authentication
#   - For short-lived, this becomes the source credential

# IAM Requirements:
#
# For short-lived credentials, you need:
#
# 1. Source credentials must have on target service account:
#    - Role: roles/iam.serviceAccountTokenCreator
#    - OR Permission: iam.serviceAccounts.generateAccessToken
#
# 2. Target service account must have:
#    - roles/compute.viewer
#    - roles/dns.reader
#    - roles/storage.objectViewer
#    - roles/run.viewer
#    - roles/cloudfunctions.viewer
#    - roles/container.viewer
#    - roles/resourcemanager.viewer
#
# 3. Enable IAM Service Account Credentials API:
#    gcloud services enable iamcredentials.googleapis.com

# Benefits of short-lived credentials:
#
# ✓ Security: Tokens auto-expire (up to 1 hour)
# ✓ Zero credential distribution: Use gcloud auth login
# ✓ CI/CD security: Minimal impersonation keys vs full-access keys
# ✓ Compliance: Aligns with zero-trust practices
# ✓ Audit trail: Each execution generates fresh tokens
# ✓ Backward compatible: All existing configs continue to work
